<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#177e89" />
    <title>Dorjee — Offline</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        background: #fdf8f1; color: #162032; text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hind Siliguri", sans-serif;
      }
      .card { max-width: 340px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 20px; margin: 20px 0 6px; }
      p { margin: 4px 0; color: #162032b3; line-height: 1.5; }
      button {
        margin-top: 20px; border: 0; border-radius: 12px; padding: 12px 22px;
        background: #177e89; color: #fff; font: 600 15px/1 inherit; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Dorjee needs an internet connection to load your orders and customers.</p>
      <p>ইন্টারনেট সংযোগ নেই। সংযোগ ফিরলে আবার চেষ্টা করুন।</p>
      <button onclick="location.reload()">Try again · আবার চেষ্টা করুন</button>
    </div>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
